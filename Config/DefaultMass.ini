

; 表现（ISM 渲染）相关：UMassProcessor 默认 ExecutionFlags=Server|Standalone（MassProcessor.cpp），
; 纯客户端世界会被跳过 ⇒ 单位在 client 上不显示、standalone/听服正常。
; 5 = Standalone(1) | Client(4)：单机 / 听服host（NM_ListenServer = Client|Server）/ 客户端都跑，
; 专用服务器不跑（和引擎自己的 UMassUpdateISMProcessor 的 flags 保持一致）。
[/Script/MassRepresentation.MassVisualizationLODProcessor]
bAutoRegisterWithProcessingPhases=True
ExecutionFlags=5

[/Script/MassRepresentation.MassVisualizationProcessor]
bAutoRegisterWithProcessingPhases=True
ExecutionFlags=5

; ApplyMovement 由 UAsceMassMovementSimulationSubsystem 手动按序跑（调度器唯一时钟）：
; 关掉引擎自动注册，否则每帧跑两份（位置双倍积分）且绕过 world init/loading 门控
[/Script/MassMovement.MassApplyMovementProcessor]
bAutoRegisterWithProcessingPhases=False

; MassLOD/复制的 viewer 位置改读服务器端 Pawn 位置（远端玩家在服务器上没有相机更新，
; 默认 GetPlayerViewPoint 拿到的是死值）。相机焦点上报方案会把客户端焦点写进这个 Pawn。
[/Script/MassLOD.MassLODSubsystem]
bUsePlayerPawnLocationInsteadOfCamera=True

; ── 技能/行为：Mass × StateTree（见 `Combat/技能编辑器设计.md` §3.3）──
; 动态 tick processor 换成项目子类（引擎默认只跑 Standalone|Server，客户端要跑表现 task）
[/Script/MassAIBehavior.MassBehaviorSettings]
DynamicStateTreeProcessorClass=/Script/AsceGame.AsceStateTreeProcessor

; 关掉引擎默认的 activation / destructor（它们只跑 Standalone|Server）；
; 听服世界的 exec flags = Client|Server ⇒ 不关的话会和我们的子类（AllNetModes）同时命中、
; 导致实例数据被重复分配 / 重复激活
[/Script/MassAIBehavior.MassStateTreeActivationProcessor]
bAutoRegisterWithProcessingPhases=False

[/Script/MassAIBehavior.MassStateTreeFragmentDestructor]
bAutoRegisterWithProcessingPhases=False

